<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dice Roller</title>
        <!-- <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">1 -->
        <link rel="stylesheet" href="/style.css" />
        <script src="dice.js"></script>
        <!-- <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script> -->
        <!-- <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script> -->
    </head>
    <body>
        <header>
            <h2>Dragon's Hoard Dice Bag</h2>
            <h3>By Devs Inc.</h3>
        </header>

        <nav>
            <p>Users instructions: Click a button, rolll a die</p>
        </nav>
        <article class="row">
            <article class="column col-sm-4">
                <img
                    class="Dice"
                    src="./src/images/d4.svg"
                    alt="D4 Die"
                    width="200"
                />
                <button class="button" id="d4" onclick="diceRoll(1,4,`roll4`)">
                    Roll a d4
                </button>
                <p id="roll4"></p>
            </article>

            <article class="column col-sm-4">
                <img
                    class="Dice"
                    src="./src/images/dice-5.svg"
                    alt="D6 Die"
                    width="200"
                />
                <button class="button" id="d6" onclick="diceRoll(1,6,`roll6`)">
                    Roll a d6
                </button>
                <p id="roll6"></p>
            </article>

            <article class="column col-sm-4">
                <img
                    class="Dice"
                    src="./src/images/d8.svg"
                    alt="D8 Die"
                    width="200"
                />
                <button class="button" id="d8" onclick="diceRoll(1,8,`roll8`)">
                    Roll a d8
                </button>
                <p id="roll8"></p>
            </article>

            <article class="column col-sm-4">
                <img
                    class="Dice"
                    src="./src/images/d10.svg"
                    alt="D10 Die"
                    width="200"
                />
                <button
                    class="button"
                    id="d10"
                    onclick="diceRoll(1,10,`roll10`)"
                >
                    Roll a d10
                </button>
                <p id="roll10"></p>
            </article>

            <article class="column col-sm-4">
                <img
                    class="Dice"
                    src="./src/images/d12.svg"
                    alt="D12 Die"
                    width="200"
                />
                <button
                    class="button"
                    id="d12"
                    onclick="diceRoll(1,12,`roll12`)"
                >
                    Roll a d12
                </button>
                <p id="roll12"></p>
            </article>

            <article class="column col-sm-4">
                <img
                    class="Dice"
                    src="./src/images/d20.svg"
                    alt="D20 Die"
                    width="200"
                />
                <button
                    class="button"
                    id="d20"
                    onclick="diceRoll(1,20,`roll20`)"
                >
                    Roll a d20
                </button>
                <p id="roll20"></p>
            </article>
        </article>

        <footer>
            <p>2050 Dev's Inc, LLC &copy; Collin Chamberlin</p>
        </footer>
    </body>
</html>
